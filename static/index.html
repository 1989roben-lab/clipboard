    <script>
      const MAX_BYTES = 200 * 1024;
      const MAX_IMAGE_TEXT_BYTES = 12 * 1024;
      const MAX_IMAGE_BYTES = 10 * 1024 * 1024;
      const MAX_FILE_BYTES = 100 * 1024 * 1024;
      const FILE_CHUNK_BYTES = 8 * 1024 * 1024;
      const MAX_IMAGE_EDGE = 1920;
      const IMAGE_COMPRESSION_THRESHOLD_BYTES = 2 * 1024 * 1024;
      const IMAGE_COMPRESSION_TARGET_BYTES = 1 * 1024 * 1024;
      const IMAGE_UPLOAD_TIMEOUT_MS = 90 * 1000;
      const IMAGE_COMPRESSION_QUALITIES = [0.82, 0.68, 0.54];
      const QUICK_PHOTO_MAX_EDGE = 1280;
      const QUICK_PHOTO_QUALITY = 0.72;
      const ALLOWED_IMAGE_TYPES = new Set([
        "image/png",
        "image/jpeg",
        "image/webp",
        "image/gif",
      ]);
      const editor = document.querySelector("#content");
      const saveButton = document.querySelector("#save-button");
      const clearButton = document.querySelector("#clear-button");
      const chooseImage = document.querySelector("#choose-image");
      const quickCamera = document.querySelector("#quick-camera");
      const imageInput = document.querySelector("#image-input");
      const pendingAttachmentPanel = document.querySelector(
        "#pending-attachment",
      );
      const pendingAttachmentName = document.querySelector(
        "#pending-attachment-name",
      );
      const pendingAttachmentSize = document.querySelector(
        "#pending-attachment-size",
      );
      const removeAttachment = document.querySelector("#remove-attachment");
      const cameraModal = document.querySelector("#camera-modal");
      const cameraPreview = document.querySelector("#camera-preview");
      const cameraStatus = document.querySelector("#camera-status");
      const cancelCamera = document.querySelector("#cancel-camera");
      const captureCamera = document.querySelector("#capture-camera");
      const counter = document.querySelector("#counter");
      const history = document.querySelector("#history");
      const entryCount = document.querySelector("#entry-count");
      const toast = document.querySelector("#toast");
      const installButton = document.querySelector("#install-button");
      const forceRefreshButton = document.querySelector("#force-refresh");
      const serviceStatus = document.querySelector("#service-status");
      const statusText = document.querySelector("#status-text");
      const installModal = document.querySelector("#install-modal");
      const installHelp = document.querySelector("#install-help");
      const closeInstallHelp = document.querySelector(
        "#close-install-help",
      );
      const encoder = new TextEncoder();
      let toastTimer;
      let deferredInstallPrompt = null;
      let entries = [];
      let pendingImage = null;
      let pendingAttachment = null;
      let pendingImageUrl = "";
      let pendingImageNode = null;
      let savedRange = null;
      let savedCaretPosition = 0;
      let filePickerPosition = null;
      let imagePreparing = false;
      let cameraStream = null;
      let cameraCapturePosition = 0;
      let reloadingForServiceWorker = false;

      function byteLength(text) {
        return encoder.encode(text).length;
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) {
          return `${(bytes / 1024).toFixed(1)} KB`;
        }
        if (bytes < 1024 * 1024 * 1024) {
          return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
        }
        return `${(bytes / 1024 / 1024 / 1024).toFixed(2)} GB`;
      }

      function serializeDraft(root) {
        let content = "";
        let imagePosition = null;
        const blockTags = new Set(["DIV", "P"]);

        function walk(parent) {
          const children = Array.from(parent.childNodes);
          children.forEach((node, index) => {
            if (
              node === pendingImageNode ||
              (node.nodeType === Node.ELEMENT_NODE &&
                node.classList.contains("inline-draft-image"))
            ) {
              imagePosition = Array.from(content).length;
              return;
            }
            if (node.nodeType === Node.TEXT_NODE) {
              content += node.nodeValue || "";
              return;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return;
            if (node.tagName === "BR") {
              content += "\n";
              return;
            }
            walk(node);
            if (
              blockTags.has(node.tagName) &&
              index < children.length - 1 &&
              !content.endsWith("\n")
            ) {
              content += "\n";
            }
          });
        }

        walk(root);
        return { content, imagePosition };
      }

      function readDraft() {
        return serializeDraft(editor);
      }

      function updateCounter() {
        const { content } = readDraft();
        const bytes = byteLength(content);
        const pendingUpload = pendingImage || pendingAttachment;
        const limit = pendingUpload ? MAX_IMAGE_TEXT_BYTES : MAX_BYTES;
        const uploadLabel = pendingAttachment
          ? "12 KB（附件说明）"
          : pendingImage
            ? "12 KB（图片说明）"
            : "200 KB";
        counter.textContent =
          `${formatBytes(bytes)} / ${uploadLabel}`;
        counter.classList.toggle("over", bytes > limit);
        saveButton.disabled =
          saveButton.dataset.loading === "true" ||
          imagePreparing ||
          (!content.trim() && !pendingUpload) ||
          bytes > limit;
      }

      function showToast(message, isError = false) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.toggle("error", isError);
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
      }

      function setServerStatus(online) {
        serviceStatus.classList.toggle("offline", !online);
        statusText.textContent = online ? "服务器在线" : "服务器未连接";
        serviceStatus.setAttribute("aria-label", statusText.textContent);
      }

      function isStandalone() {
        return (
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true
        );
      }

      function mobilePlatform() {
        const userAgent = navigator.userAgent || "";
        if (
          /iPhone|iPad|iPod/i.test(userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        ) {
          return "ios";
        }
        if (/Android/i.test(userAgent)) return "android";
        return "desktop";
      }

      function updateInstallButton() {
        const platform = mobilePlatform();
        document.documentElement.dataset.platform = platform;
        document.documentElement.dataset.standalone = String(isStandalone());
        installButton.textContent = "安装 Memory";
        installButton.hidden = isStandalone();
      }

      function showInstallHelp() {
        const platform = mobilePlatform();
        if (platform === "ios") {
          installHelp.textContent =
            "请使用 Safari 打开 Memory，点击底部的“分享”按钮，再选择“添加到主屏幕”。\n\n安装后 Memory 会以独立窗口运行；如果没有看到该选项，请在分享菜单底部选择“编辑操作”并添加它。";
        } else if (platform === "android") {
          installHelp.textContent = window.isSecureContext
            ? "请使用 Chrome 打开 Memory，点击右上角菜单，然后选择“安装应用”或“添加到主屏幕”。"
            : "请使用 Chrome 打开 Memory，点击右上角菜单，再选择“添加到主屏幕”来创建手机快捷方式。\n\n当前页面使用 HTTP；如需安装完整 PWA，需要先配置 HTTPS。";
        } else {
          installHelp.textContent =
            "当前浏览器没有提供自动安装提示。请打开浏览器菜单，选择“安装应用”或“创建快捷方式”。";
        }
        installModal.hidden = false;
        closeInstallHelp.focus();
      }

      async function updateApplicationShell() {
        if (!("serviceWorker" in navigator)) return;
        try {
          const registration =
            await navigator.serviceWorker.getRegistration();
          if (registration?.waiting) {
            registration.waiting.postMessage({ type: "ACTIVATE_UPDATE" });
          }
          await registration?.update();
        } catch {
          // The current page remains usable if an update check is unavailable.
        }
      }

      async function checkServerStatus() {
        try {
          const response = await fetch("/health", { cache: "no-store" });
          setServerStatus(response.ok);
          return response.ok;
        } catch {
          setServerStatus(false);
          return false;
        }
      }

      async function api(path, options = {}) {
        let response;
        try {
          response = await fetch(path, {
            ...options,
            cache: options.cache || "no-store",
            headers: {
              "Content-Type": "application/json",
              ...(options.headers || {}),
            },
          });
          setServerStatus(true);
        } catch (error) {
          setServerStatus(false);
          throw error;
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `请求失败（${response.status}）`);
        }
        return data;
      }

      function formatTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(date);
      }

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.left = "-9999px";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        helper.setSelectionRange(0, helper.value.length);
        const copied = document.execCommand("copy");
        helper.remove();
        if (!copied) throw new Error("浏览器未允许复制");
      }

      function entriesAreEqual(nextEntries) {
        if (entries.length !== nextEntries.length) return false;
        return entries.every((entry, index) => {
          const next = nextEntries[index];
          return (
            entry.id === next.id &&
            entry.created_at === next.created_at &&
            entry.type === next.type &&
            entry.content === next.content &&
            entry.filename === next.filename &&
            entry.mime_type === next.mime_type &&
            entry.size_bytes === next.size_bytes &&
            entry.image_position === next.image_position
          );
        });
      }

      function captureScrollState() {
        const entryScroll = new Map();
        document.querySelectorAll("pre[data-entry-id]").forEach((element) => {
          entryScroll.set(element.dataset.entryId, {
            top: element.scrollTop,
            left: element.scrollLeft,
          });
        });
        return {
          pageX: window.scrollX,
          pageY: window.scrollY,
          entryScroll,
        };
      }

      function restoreScrollState(state) {
        if (!state) return;
        requestAnimationFrame(() => {
          window.scrollTo(state.pageX, state.pageY);
          document.querySelectorAll("pre[data-entry-id]").forEach((element) => {
            const saved = state.entryScroll.get(element.dataset.entryId);
            if (saved) {
              element.scrollTop = saved.top;
              element.scrollLeft = saved.left;
            }
          });
        });
      }

      function startEntryEdit(entry, contentNode, editButton) {
        const isTextEntry = entry.type === "text";
        const limit = isTextEntry ? MAX_BYTES : MAX_IMAGE_TEXT_BYTES;
        const limitLabel = isTextEntry ? "200 KB" : "12 KB";
        const editLabel =
          entry.type === "image"
            ? "编辑图片说明"
            : entry.type === "file"
              ? "编辑附件说明"
              : "编辑文字内容";
        const panel = document.createElement("div");
        panel.className = "entry-editor";

        const textarea = document.createElement("textarea");
        textarea.value = entry.content || "";
        textarea.setAttribute("aria-label", editLabel);
        textarea.placeholder = isTextEntry ? "输入文字内容" : "添加说明（可留空）";
        textarea.spellcheck = false;

        const footer = document.createElement("div");
        footer.className = "entry-editor-footer";
        const count = document.createElement("span");
        count.className = "entry-editor-count";
        const editorActions = document.createElement("div");
        editorActions.className = "entry-editor-actions";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "secondary";
        cancel.textContent = "取消";
        const submit = document.createElement("button");
        submit.type = "button";
        submit.className = "primary";
        submit.textContent = "保存修改";

        function updateEditState() {
          const bytes = byteLength(textarea.value);
          count.textContent = `${formatBytes(bytes)} / ${limitLabel}`;
          count.classList.toggle("over", bytes > limit);
          submit.disabled =
            (isTextEntry && !textarea.value.trim()) || bytes > limit;
        }

        function cancelEdit() {
          panel.replaceWith(contentNode);
          editButton.disabled = false;
        }

        async function submitEdit() {
          submit.disabled = true;
          submit.textContent = "保存中…";
          try {
            const data = await api(`/api/entries/${entry.id}`, {
              method: "PATCH",
              body: JSON.stringify({ content: textarea.value }),
            });
            entries = entries.map((item) =>
              item.id === entry.id ? data.entry : item,
            );
            renderEntries({ preserveScroll: true });
            showToast("修改已保存");
          } catch (error) {
            showToast(error.message, true);
            submit.textContent = "保存修改";
            updateEditState();
          }
        }

        textarea.addEventListener("input", updateEditState);
        textarea.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            cancelEdit();
          } else if (
            (event.ctrlKey || event.metaKey) &&
            event.key === "Enter" &&
            !submit.disabled
          ) {
            event.preventDefault();
            submitEdit();
          }
        });
        cancel.addEventListener("click", cancelEdit);
        submit.addEventListener("click", submitEdit);
        editorActions.append(cancel, submit);
        footer.append(count, editorActions);
        panel.append(textarea, footer);
        contentNode.replaceWith(panel);
        editButton.disabled = true;
        updateEditState();
        textarea.focus();
        textarea.setSelectionRange(
          textarea.value.length,
          textarea.value.length,
        );
      }

      function renderEntries({ preserveScroll = false } = {}) {
        const scrollState = preserveScroll ? captureScrollState() : null;
        history.replaceChildren();
        entryCount.textContent = entries.length
          ? `${entries.length} / 100 条`
          : "0 条";
        clearButton.disabled = entries.length === 0;

        if (!entries.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          const title = document.createElement("strong");
          title.textContent = "还没有保存内容";
          const description = document.createElement("span");
          description.textContent = "在上方粘贴文本，第一条记录会显示在这里。";
          empty.append(title, description);
          history.appendChild(empty);
          return;
        }

        for (const entry of entries) {
          const article = document.createElement("article");
          article.className = "entry";

          const meta = document.createElement("div");
          meta.className = "entry-meta";

          const metaLeft = document.createElement("div");
          metaLeft.className = "meta-left";

          const badge = document.createElement("span");
          badge.className = "kind-badge";
          badge.textContent =
            entry.type === "image"
              ? entry.content
                ? "图文"
                : "图片"
              : entry.type === "file"
                ? "附件"
                : "文字";

          const time = document.createElement("time");
          time.dateTime = entry.created_at;
          time.textContent = formatTime(entry.created_at);
          metaLeft.append(badge, time);

          const actions = document.createElement("div");
          actions.className = "entry-actions";

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "icon-button";
          remove.textContent = "删除";
          remove.setAttribute(
            "aria-label",
            `删除 ${entry.filename || time.textContent} 的记录`,
          );
          remove.addEventListener("click", () => deleteEntry(entry.id));

          if (entry.type === "image") {
            const edit = document.createElement("button");
            edit.type = "button";
            edit.className = "secondary";
            edit.textContent = "编辑";
            actions.append(edit);
            if (entry.content) {
              const copy = document.createElement("button");
              copy.type = "button";
              copy.className = "secondary";
              copy.textContent = "复制文字";
              copy.addEventListener("click", async () => {
                try {
                  await copyText(entry.content);
                  showToast("已复制附带文字");
                } catch (error) {
                  showToast(`复制失败：${error.message}`, true);
                }
              });
              actions.append(copy);
            }

            const view = document.createElement("a");
            view.className = "secondary-link";
            view.href = `/api/images/${entry.id}`;
            view.target = "_blank";
            view.rel = "noopener";
            view.textContent = "查看原图";

            const download = document.createElement("a");
            download.className = "secondary-link";
            download.href = `/api/images/${entry.id}/download`;
            download.textContent = "下载";

            actions.append(view, download, remove);
            meta.append(metaLeft, actions);

            const imageContent = document.createElement("div");
            imageContent.className = "image-content";
            const contentCharacters = Array.from(entry.content || "");
            const imagePosition = Math.max(
              0,
              Math.min(
                Number.isInteger(entry.image_position)
                  ? entry.image_position
                  : 0,
                contentCharacters.length,
              ),
            );
            const beforeImage = contentCharacters
              .slice(0, imagePosition)
              .join("");
            const afterImage = contentCharacters
              .slice(imagePosition)
              .join("");

            function appendCaption(text, placement) {
              if (!text) return;
              const caption = document.createElement("pre");
              caption.className = `image-caption ${placement}`;
              caption.dataset.entryId = String(entry.id);
              caption.textContent = text;
              imageContent.append(caption);
            }

            const previewLink = document.createElement("a");
            previewLink.className = "image-preview-link";
            previewLink.href = `/api/images/${entry.id}`;
            previewLink.target = "_blank";
            previewLink.rel = "noopener";
            previewLink.setAttribute(
              "aria-label",
              `查看原图：${entry.filename}`,
            );

            const image = document.createElement("img");
            image.className = "image-preview";
            image.src = `/api/images/${entry.id}`;
            image.alt = entry.filename || "上传的图片";
            image.loading = "lazy";
            image.decoding = "async";

            const details = document.createElement("div");
            details.className = "image-details";
            const fileInfo = document.createElement("div");
            fileInfo.style.minWidth = "0";
            const filename = document.createElement("p");
            filename.className = "file-name";
            filename.textContent = entry.filename || "图片";
            const size = document.createElement("span");
            size.className = "file-size";
            size.textContent = formatBytes(entry.size_bytes || 0);
            fileInfo.append(filename, size);
            details.append(fileInfo);
            previewLink.append(image);
            appendCaption(beforeImage, "before-image");
            imageContent.append(previewLink);
            appendCaption(afterImage, "after-image");
            imageContent.append(details);
            edit.addEventListener("click", () =>
              startEntryEdit(entry, imageContent, edit),
            );
            article.append(meta, imageContent);
          } else if (entry.type === "file") {
            const edit = document.createElement("button");
            edit.type = "button";
            edit.className = "secondary";
            edit.textContent = "编辑";
            actions.append(edit);
            if (entry.content) {
              const copy = document.createElement("button");
              copy.type = "button";
              copy.className = "secondary";
              copy.textContent = "复制说明";
              copy.addEventListener("click", async () => {
                try {
                  await copyText(entry.content);
                  showToast("已复制附件说明");
                } catch (error) {
                  showToast(`复制失败：${error.message}`, true);
                }
              });
              actions.append(copy);
            }

            const download = document.createElement("a");
            download.className = "secondary-link";
            download.href = `/api/files/${entry.id}/download`;
            download.textContent = "下载";
            actions.append(download, remove);
            meta.append(metaLeft, actions);

            const attachmentContent = document.createElement("div");
            attachmentContent.className = "attachment-content";
            const attachmentCard = document.createElement("div");
            attachmentCard.className = "attachment-card";
            const icon = document.createElement("span");
            icon.className = "attachment-icon";
            icon.textContent = "FILE";
            const fileInfo = document.createElement("div");
            fileInfo.style.minWidth = "0";
            const filename = document.createElement("p");
            filename.className = "file-name";
            filename.textContent = entry.filename || "附件";
            const size = document.createElement("span");
            size.className = "file-size";
            size.textContent = formatBytes(entry.size_bytes || 0);
            fileInfo.append(filename, size);
            attachmentCard.append(icon, fileInfo);
            attachmentContent.append(attachmentCard);
            if (entry.content) {
              const note = document.createElement("pre");
              note.dataset.entryId = String(entry.id);
              note.textContent = entry.content;
              attachmentContent.append(note);
            }
            edit.addEventListener("click", () =>
              startEntryEdit(entry, attachmentContent, edit),
            );
            article.append(meta, attachmentContent);
          } else {
            const edit = document.createElement("button");
            edit.type = "button";
            edit.className = "secondary";
            edit.textContent = "编辑";

            const copy = document.createElement("button");
            copy.type = "button";
            copy.className = "secondary";
            copy.textContent = "复制";
            copy.addEventListener("click", async () => {
              try {
                await copyText(entry.content);
                showToast("已复制完整内容");
              } catch (error) {
                showToast(`复制失败：${error.message}`, true);
              }
            });

            const content = document.createElement("pre");
            content.dataset.entryId = String(entry.id);
            content.textContent = entry.content;

            edit.addEventListener("click", () =>
              startEntryEdit(entry, content, edit),
            );

            actions.append(edit, copy, remove);
            meta.append(metaLeft, actions);
            article.append(meta, content);
          }
          history.appendChild(article);
        }
        restoreScrollState(scrollState);
      }

      async function loadEntries({ silent = false, force = false } = {}) {
        try {
          const data = await api("/api/entries");
          setServerStatus(true);
          if (!force && entriesAreEqual(data.entries)) return true;
          entries = data.entries;
          renderEntries({ preserveScroll: true });
          return true;
        } catch (error) {
          if (!silent) {
            history.innerHTML = "";
            const message = document.createElement("div");
            message.className = "empty";
            message.textContent = navigator.onLine
              ? "服务器暂时无法连接，请稍后重试。"
              : "当前处于离线状态，联网后会自动恢复。";
            history.appendChild(message);
            showToast(error.message, true);
          }
          return false;
        }
      }

      async function saveEntry() {
        const { content, imagePosition } = readDraft();
        const bytes = byteLength(content);
        const pendingUpload = pendingImage || pendingAttachment;
        const limit = pendingUpload ? MAX_IMAGE_TEXT_BYTES : MAX_BYTES;
        if (!content.trim() && !pendingUpload) {
          showToast("请先记录想法、选择图片或添加附件", true);
          editor.focus();
          return false;
        }
        if (bytes > limit) {
          showToast(
            pendingAttachment
              ? "附件说明不能超过 12 KB"
              : pendingImage
                ? "图片附带文字不能超过 12 KB"
              : "单条内容不能超过 200 KB",
            true,
          );
          return false;
        }

        saveButton.dataset.loading = "true";
        saveButton.textContent = "正在保存…";
        updateCounter();
        try {
          let data;
          if (pendingAttachment) {
            data = await uploadAttachment(pendingAttachment, content);
          } else if (pendingImage) {
            const controller = new AbortController();
            const timeout = setTimeout(
              () => controller.abort(),
              IMAGE_UPLOAD_TIMEOUT_MS,
            );
            let response;
            try {
              response = await fetch("/api/images", {
                method: "POST",
                headers: {
                  "Content-Type": pendingImage.type,
                  "X-Filename": encodeURIComponent(
                    normalizedFilename(pendingImage),
                  ),
                  "X-Content": encodeURIComponent(content),
                  "X-Image-Position": String(imagePosition ?? 0),
                },
                body: pendingImage,
                signal: controller.signal,
              });
            } catch (error) {
              if (error.name === "AbortError") {
                throw new Error("图片上传超过 90 秒，请检查网络后重试");
              }
              throw error;
            } finally {
              clearTimeout(timeout);
            }
            data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(
                data.error || `图片保存失败（${response.status}）`,
              );
            }
          } else {
            data = await api("/api/entries", {
              method: "POST",
              body: JSON.stringify({ content }),
            });
          }
          entries = [data.entry, ...entries].slice(0, 100);
          clearEditor();
          updateCounter();
          renderEntries();
          showToast(
            data.entry.type === "image"
              ? "图片和记忆已存入 Memory"
              : data.entry.type === "file"
                ? "附件已存入 Memory"
                : "记忆已存入 Memory",
          );
          return true;
        } catch (error) {
          showToast(error.message, true);
          return false;
        } finally {
          delete saveButton.dataset.loading;
          saveButton.textContent = "存入 Memory";
          updateCounter();
        }
      }

      async function uploadAttachment(file, content) {
        let uploadId = "";
        try {
          const initialized = await api("/api/file-uploads", {
            method: "POST",
            body: JSON.stringify({
              filename: file.name || `attachment-${Date.now()}`,
              mime_type: file.type || "application/octet-stream",
              size: file.size,
              content,
            }),
          });
          uploadId = initialized.upload_id;
          const chunkSize = Math.min(
            initialized.chunk_size || FILE_CHUNK_BYTES,
            FILE_CHUNK_BYTES,
          );
          let offset = initialized.received || 0;
          while (offset < file.size) {
            const chunk = file.slice(
              offset,
              Math.min(offset + chunkSize, file.size),
            );
            let response;
            let payload;
            for (let attempt = 0; attempt < 3; attempt += 1) {
              try {
                response = await fetch(`/api/file-uploads/${uploadId}`, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/octet-stream",
                    "X-Upload-Offset": String(offset),
                  },
                  body: chunk,
                });
                payload = await response.json().catch(() => ({}));
                if (response.ok) break;
              } catch (error) {
                if (attempt === 2) throw error;
              }
              if (attempt < 2) {
                await new Promise((resolve) =>
                  setTimeout(resolve, 700 * (attempt + 1)),
                );
              }
            }
            if (!response?.ok) {
              throw new Error(
                payload?.error ||
                  `附件分片上传失败（${response?.status || "网络错误"}）`,
              );
            }
            offset = payload.received;
            const progress =
              file.size === 0
                ? 100
                : Math.min(100, Math.round((offset / file.size) * 100));
            saveButton.textContent = `正在上传 ${progress}%`;
          }
          return await api(`/api/file-uploads/${uploadId}/complete`, {
            method: "POST",
            body: "{}",
          });
        } catch (error) {
          if (uploadId) {
            fetch(`/api/file-uploads/${uploadId}`, {
              method: "DELETE",
              keepalive: true,
            }).catch(() => {});
          }
          throw error;
        }
      }

      function normalizedFilename(file) {
        if (file.name) return file.name;
        const extension = {
          "image/png": "png",
          "image/jpeg": "jpg",
          "image/webp": "webp",
          "image/gif": "gif",
        }[file.type] || "png";
        return `clipboard-${Date.now()}.${extension}`;
      }

      function selectionIsInEditor(range) {
        return Boolean(
          range &&
            (range.commonAncestorContainer === editor ||
              editor.contains(range.commonAncestorContainer)),
        );
      }

      function caretPositionForRange(range) {
        if (!selectionIsInEditor(range)) return savedCaretPosition;
        const beforeCaret = document.createRange();
        beforeCaret.selectNodeContents(editor);
        beforeCaret.setEnd(range.startContainer, range.startOffset);
        const fragment = beforeCaret.cloneContents();
        return Array.from(serializeDraft(fragment).content).length;
      }

      function rememberCaret() {
        const selection = window.getSelection();
        if (
          selection?.rangeCount &&
          selectionIsInEditor(selection.getRangeAt(0))
        ) {
          savedRange = selection.getRangeAt(0).cloneRange();
          savedCaretPosition = caretPositionForRange(
            selection.getRangeAt(0),
          );
        }
      }

      function editorEndRange() {
        const range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        return range;
      }

      function currentEditorRange() {
        const selection = window.getSelection();
        if (
          selection?.rangeCount &&
          selectionIsInEditor(selection.getRangeAt(0))
        ) {
          return selection.getRangeAt(0).cloneRange();
        }
        if (selectionIsInEditor(savedRange)) {
          return savedRange.cloneRange();
        }
        return editorEndRange();
      }

      function selectRange(range) {
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        savedRange = range.cloneRange();
        savedCaretPosition = caretPositionForRange(range);
      }

      function insertPlainText(text) {
        const range = currentEditorRange();
        range.deleteContents();
        const fragment = document.createDocumentFragment();
        const lines = text.replace(/\r\n?/g, "\n").split("\n");
        let lastNode = null;
        lines.forEach((line, index) => {
          if (line) {
            lastNode = document.createTextNode(line);
            fragment.append(lastNode);
          }
          if (index < lines.length - 1) {
            lastNode = document.createElement("br");
            fragment.append(lastNode);
          }
        });
        if (!lastNode) {
          lastNode = document.createTextNode("");
          fragment.append(lastNode);
        }
        range.insertNode(fragment);
        range.setStartAfter(lastNode);
        range.collapse(true);
        selectRange(range);
        updateCounter();
      }

      function releasePendingImage() {
        pendingImage = null;
        if (pendingImageUrl) URL.revokeObjectURL(pendingImageUrl);
        pendingImageUrl = "";
        pendingImageNode = null;
        imageInput.value = "";
      }

      function removePendingImage({ focus = true } = {}) {
        if (pendingImageNode?.isConnected) {
          const range = document.createRange();
          range.setStartBefore(pendingImageNode);
          range.collapse(true);
          pendingImageNode.remove();
          releasePendingImage();
          if (focus) {
            editor.focus();
            selectRange(range);
          }
        } else {
          releasePendingImage();
        }
        updateCounter();
      }

      function releasePendingAttachment() {
        pendingAttachment = null;
        pendingAttachmentName.textContent = "";
        pendingAttachmentSize.textContent = "";
        pendingAttachmentPanel.hidden = true;
      }

      function removePendingAttachment({ focus = true } = {}) {
        releasePendingAttachment();
        if (focus) editor.focus();
        updateCounter();
      }

      function stageAttachment(file) {
        if (!file) return false;
        if (file.size > MAX_FILE_BYTES) {
          showToast("单个附件不能超过 100 MB", true);
          return false;
        }
        if (pendingImage) removePendingImage({ focus: false });
        pendingAttachment = file;
        pendingAttachmentName.textContent =
          file.name || `attachment-${Date.now()}`;
        pendingAttachmentSize.textContent =
          `${formatBytes(file.size)} · 上限 100 MB`;
        pendingAttachmentPanel.hidden = false;
        updateCounter();
        showToast(`已选择附件：${pendingAttachmentName.textContent}`);
        return true;
      }

      function clearEditor() {
        editor.replaceChildren();
        releasePendingImage();
        releasePendingAttachment();
        savedRange = null;
        savedCaretPosition = 0;
        filePickerPosition = null;
      }

      function appendPlainText(parent, text) {
        const fragment = document.createDocumentFragment();
        const lines = text.split("\n");
        let firstNode = null;
        let lastNode = null;
        lines.forEach((line, index) => {
          if (line) {
            const textNode = document.createTextNode(line);
            firstNode ||= textNode;
            lastNode = textNode;
            fragment.append(textNode);
          }
          if (index < lines.length - 1) {
            const lineBreak = document.createElement("br");
            firstNode ||= lineBreak;
            lastNode = lineBreak;
            fragment.append(lineBreak);
          }
        });
        parent.append(fragment);
        return { firstNode, lastNode };
      }

      function canvasToBlob(canvas, type, quality) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) => {
              if (blob) resolve(blob);
              else reject(new Error("浏览器无法编码压缩后的图片"));
            },
            type,
            quality,
          );
        });
      }

      async function createQuickPhoto(
        source,
        sourceWidth,
        sourceHeight,
      ) {
        if (!sourceWidth || !sourceHeight) {
          throw new Error("摄像头画面尚未准备完成");
        }
        const scale = Math.min(
          1,
          QUICK_PHOTO_MAX_EDGE / Math.max(sourceWidth, sourceHeight),
        );
        const width = Math.max(1, Math.round(sourceWidth * scale));
        const height = Math.max(1, Math.round(sourceHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("浏览器无法处理摄像头画面");
        context.drawImage(source, 0, 0, width, height);
        try {
          const blob = await canvasToBlob(
            canvas,
            "image/jpeg",
            QUICK_PHOTO_QUALITY,
          );
          if (blob.type !== "image/jpeg") {
            throw new Error("当前浏览器无法生成快速照片");
          }
          return {
            file: new File(
              [blob],
              `quick-photo-${Date.now()}.jpg`,
              { type: "image/jpeg" },
            ),
            width,
            height,
          };
        } finally {
          canvas.width = 1;
          canvas.height = 1;
        }
      }

      function stopQuickCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach((track) => track.stop());
        }
        cameraStream = null;
        cameraPreview.srcObject = null;
        cameraModal.hidden = true;
        cameraStatus.textContent = "照片会自动缩小并立即上传";
        captureCamera.disabled = false;
        cancelCamera.disabled = false;
        quickCamera.disabled = false;
      }

      async function openQuickCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          showToast("当前浏览器不支持网页相机，请使用“选择图片”添加照片", true);
          return;
        }
        cameraCapturePosition = savedCaretPosition;
        quickCamera.disabled = true;
        cameraStatus.textContent = "正在打开后置摄像头…";
        cameraModal.hidden = false;
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 960 },
              frameRate: { ideal: 15, max: 30 },
              resizeMode: "crop-and-scale",
            },
          });
          cameraPreview.srcObject = cameraStream;
          await cameraPreview.play();
          cameraStatus.textContent =
            "点击“拍照并上传”，通常可在10秒内完成";
          captureCamera.focus();
        } catch (error) {
          stopQuickCamera();
          const denied =
            error.name === "NotAllowedError" ||
            error.name === "SecurityError";
          showToast(
            denied
              ? "请允许浏览器使用摄像头后重试"
              : `无法打开摄像头：${error.message}`,
            true,
          );
        }
      }

      async function captureAndUploadQuickPhoto() {
        captureCamera.disabled = true;
        cancelCamera.disabled = true;
        cameraStatus.textContent = "正在生成快速照片…";
        const startedAt = performance.now();
        try {
          const photo = await createQuickPhoto(
            cameraPreview,
            cameraPreview.videoWidth,
            cameraPreview.videoHeight,
          );
          stopQuickCamera();
          const staged = await stageImage(
            photo.file,
            cameraCapturePosition,
          );
          if (!staged) return;
          const saved = await saveEntry();
          if (saved) {
            const elapsedSeconds = (
              (performance.now() - startedAt) /
              1000
            ).toFixed(1);
            showToast(
              `快速照片已上传：${photo.width}×${photo.height}、${formatBytes(photo.file.size)}，用时 ${elapsedSeconds} 秒`,
            );
          }
        } catch (error) {
          stopQuickCamera();
          showToast(`快速拍照失败：${error.message}`, true);
        }
      }

      function compressedFilename(filename, extension) {
        const name = filename || `image-${Date.now()}`;
        const dot = name.lastIndexOf(".");
        const stem = dot > 0 ? name.slice(0, dot) : name;
        return `${stem}.${extension}`;
      }

      async function encodeOptimizedImage(canvas, quality) {
        const webpBlob = await canvasToBlob(
          canvas,
          "image/webp",
          quality,
        );
        if (webpBlob.type === "image/webp") {
          return {
            blob: webpBlob,
            type: "image/webp",
            extension: "webp",
          };
        }
        const jpegBlob = await canvasToBlob(
          canvas,
          "image/jpeg",
          quality,
        );
        if (jpegBlob.type !== "image/jpeg") {
          throw new Error("当前浏览器无法编码压缩图片");
        }
        return {
          blob: jpegBlob,
          type: "image/jpeg",
          extension: "jpg",
        };
      }

      async function optimizeImage(file) {
        const bitmap = await createImageBitmap(file);
        const sourceWidth = bitmap.width;
        const sourceHeight = bitmap.height;
        const scale = Math.min(
          1,
          MAX_IMAGE_EDGE / Math.max(sourceWidth, sourceHeight),
        );
        const width = Math.max(1, Math.round(sourceWidth * scale));
        const height = Math.max(1, Math.round(sourceHeight * scale));
        const resized = width !== sourceWidth || height !== sourceHeight;

        if (
          !resized &&
          file.size <= IMAGE_COMPRESSION_THRESHOLD_BYTES
        ) {
          bitmap.close();
          return {
            file,
            compressed: false,
            resized: false,
            sourceWidth,
            sourceHeight,
            width,
            height,
          };
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        if (!context) {
          bitmap.close();
          throw new Error("浏览器无法处理这张图片");
        }
        context.drawImage(bitmap, 0, 0, width, height);

        let bestImage = null;
        try {
          for (const quality of IMAGE_COMPRESSION_QUALITIES) {
            const encoded = await encodeOptimizedImage(canvas, quality);
            if (!bestImage || encoded.blob.size < bestImage.blob.size) {
              bestImage = encoded;
            }
            if (
              encoded.blob.size <= IMAGE_COMPRESSION_TARGET_BYTES
            ) {
              break;
            }
          }
        } finally {
          bitmap.close();
          canvas.width = 1;
          canvas.height = 1;
        }

        if (
          !bestImage ||
          (!resized && bestImage.blob.size >= file.size)
        ) {
          return {
            file,
            compressed: false,
            resized: false,
            sourceWidth,
            sourceHeight,
            width,
            height,
          };
        }
        return {
          file: new File(
            [bestImage.blob],
            compressedFilename(file.name, bestImage.extension),
            {
              type: bestImage.type,
              lastModified: file.lastModified,
            },
          ),
          compressed: true,
          resized,
          sourceWidth,
          sourceHeight,
          width,
          height,
        };
      }

      async function prepareImage(file) {
        if (file.type === "image/gif") {
          return { file, compressed: false, resized: false };
        }
        try {
          return await optimizeImage(file);
        } catch (error) {
          if (file.size <= MAX_IMAGE_BYTES) {
            showToast(`自动优化失败，将使用原图：${error.message}`, true);
            return { file, compressed: false, resized: false };
          }
          throw error;
        }
      }

      async function stageImage(file, preferredPosition = null) {
        if (!file) return false;
        if (!ALLOWED_IMAGE_TYPES.has(file.type)) {
          showToast("仅支持 PNG、JPEG、WebP 和 GIF 图片", true);
          return false;
        }
        if (!file.size) {
          showToast("图片不能为空", true);
          return false;
        }
        if (imagePreparing) {
          showToast("正在处理上一张图片，请稍候", true);
          return false;
        }
        releasePendingAttachment();

        const originalSize = file.size;
        let prepared;
        imagePreparing = true;
        chooseImage.disabled = true;
        updateCounter();
        if (file.type !== "image/gif") {
          showToast("正在优化图片，请稍候…");
        }
        try {
          prepared = await prepareImage(file);
        } catch (error) {
          showToast(`图片压缩失败：${error.message}`, true);
          return false;
        } finally {
          imagePreparing = false;
          chooseImage.disabled = false;
          updateCounter();
        }
        file = prepared.file;
        if (file.size > MAX_IMAGE_BYTES) {
          showToast(
            "自动优化后仍超过 10 MB，请改用较小的图片",
            true,
          );
          return false;
        }

        const currentRange = currentEditorRange();
        const caretPosition =
          Number.isInteger(preferredPosition)
            ? preferredPosition
            : caretPositionForRange(currentRange);
        const draft = readDraft();
        const characters = Array.from(draft.content);
        const insertionPosition = Math.max(
          0,
          Math.min(caretPosition, characters.length),
        );
        const beforeImage = characters
          .slice(0, insertionPosition)
          .join("");
        const afterImage = characters.slice(insertionPosition).join("");

        if (pendingImageUrl) URL.revokeObjectURL(pendingImageUrl);
        pendingImage = file;
        pendingImageUrl = URL.createObjectURL(file);

        const wrapper = document.createElement("div");
        wrapper.className = "inline-draft-image";
        wrapper.contentEditable = "false";
        wrapper.setAttribute("data-draft-image", "");

        const image = document.createElement("img");
        image.src = pendingImageUrl;
        image.alt = "待保存图片";

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "inline-draft-remove";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "移除待保存图片");
        remove.addEventListener("mousedown", (event) => {
          event.preventDefault();
        });
        remove.addEventListener("click", () => removePendingImage());
        wrapper.append(image, remove);

        editor.replaceChildren();
        appendPlainText(editor, beforeImage);
        editor.append(wrapper);
        const afterNodes = appendPlainText(editor, afterImage);
        pendingImageNode = wrapper;

        const insertionRange = document.createRange();
        if (afterNodes.firstNode) {
          insertionRange.setStartBefore(afterNodes.firstNode);
        } else {
          insertionRange.setStartAfter(wrapper);
        }
        insertionRange.collapse(true);
        editor.focus();
        selectRange(insertionRange);
        savedCaretPosition = insertionPosition;
        updateCounter();
        if (prepared.compressed) {
          const dimensions = prepared.resized
            ? `${prepared.sourceWidth}×${prepared.sourceHeight} → ${prepared.width}×${prepared.height}`
            : `${prepared.width}×${prepared.height}（尺寸不变）`;
          showToast(
            `图片已优化：${dimensions}，${formatBytes(originalSize)} → ${formatBytes(file.size)}`,
          );
        } else {
          showToast("图片已插入光标位置，点击保存后才会发送");
        }
        return true;
      }

      async function deleteEntry(id) {
        try {
          await api(`/api/entries/${id}`, { method: "DELETE" });
          entries = entries.filter((entry) => entry.id !== id);
          renderEntries();
          showToast("记录已删除");
        } catch (error) {
          showToast(error.message, true);
        }
      }

      async function clearEntries() {
        const confirmed = window.confirm(
          "确定清空全部文字、图片和附件吗？服务器中的原始文件与未完成上传也会永久删除，此操作无法撤销。",
        );
        if (!confirmed) return;
        try {
          const result = await api("/api/entries", { method: "DELETE" });
          entries = [];
          renderEntries();
          const uploadMessage = result.cancelled_uploads
            ? `，并取消 ${result.cancelled_uploads} 个未完成上传`
            : "";
          showToast(
            `已永久删除 ${result.deleted || 0} 条记忆${uploadMessage}`,
          );
        } catch (error) {
          showToast(error.message, true);
        }
      }

      editor.addEventListener("input", () => {
        rememberCaret();
        updateCounter();
      });
      editor.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          saveEntry();
          return;
        }
        if (event.key === "Enter") {
          event.preventDefault();
          insertPlainText("\n");
          return;
        }
        if (
          (event.ctrlKey || event.metaKey) &&
          ["b", "i", "u"].includes(event.key.toLowerCase())
        ) {
          event.preventDefault();
        }
      });
      editor.addEventListener("beforeinput", (event) => {
        if (event.inputType.startsWith("format")) {
          event.preventDefault();
        }
      });
      for (const eventName of ["keyup", "mouseup", "focus"]) {
        editor.addEventListener(eventName, rememberCaret);
      }
      document.addEventListener("selectionchange", rememberCaret);
      editor.addEventListener("blur", (event) => {
        rememberCaret();
        if (
          event.relatedTarget === chooseImage ||
          event.relatedTarget === quickCamera
        ) {
          filePickerPosition = savedCaretPosition;
        }
      });
      saveButton.addEventListener("click", saveEntry);
      clearButton.addEventListener("click", clearEntries);
      removeAttachment.addEventListener("click", () =>
        removePendingAttachment(),
      );
      chooseImage.addEventListener("mousedown", (event) => {
        event.preventDefault();
        filePickerPosition = savedCaretPosition;
      });
      chooseImage.addEventListener("click", () => imageInput.click());
      quickCamera.addEventListener("mousedown", (event) => {
        event.preventDefault();
        cameraCapturePosition = savedCaretPosition;
      });
      quickCamera.addEventListener("click", openQuickCamera);
      cancelCamera.addEventListener("click", stopQuickCamera);
      captureCamera.addEventListener(
        "click",
        captureAndUploadQuickPhoto,
      );
      cameraModal.addEventListener("click", (event) => {
        if (event.target === cameraModal) stopQuickCamera();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !cameraModal.hidden) {
          stopQuickCamera();
        }
      });
      window.addEventListener("pagehide", stopQuickCamera);
      imageInput.addEventListener("change", () => {
        const file = imageInput.files?.[0];
        imageInput.value = "";
        if (file && ALLOWED_IMAGE_TYPES.has(file.type)) {
          stageImage(file, filePickerPosition);
        } else {
          stageAttachment(file);
        }
        filePickerPosition = null;
      });
      for (const eventName of ["dragenter", "dragover"]) {
        editor.addEventListener(eventName, (event) => {
          event.preventDefault();
          editor.classList.add("dragging");
        });
      }
      for (const eventName of ["dragleave", "drop"]) {
        editor.addEventListener(eventName, (event) => {
          event.preventDefault();
          editor.classList.remove("dragging");
        });
      }
      editor.addEventListener("drop", (event) => {
        const file = event.dataTransfer.files?.[0];
        if (!file) return;
        if (ALLOWED_IMAGE_TYPES.has(file.type)) {
          stageImage(file);
        } else {
          stageAttachment(file);
        }
      });
      editor.addEventListener("paste", (event) => {
        const file = event.clipboardData?.files?.[0];
        event.preventDefault();
        if (file) {
          if (ALLOWED_IMAGE_TYPES.has(file.type)) {
            stageImage(file);
          } else {
            stageAttachment(file);
          }
          return;
        }
        insertPlainText(event.clipboardData?.getData("text/plain") || "");
      });

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        updateInstallButton();
      });
      installButton.addEventListener("click", async () => {
        if (!deferredInstallPrompt) {
          showInstallHelp();
          return;
        }
        installButton.disabled = true;
        try {
          await deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice;
          if (choice.outcome === "accepted") {
            deferredInstallPrompt = null;
            installButton.hidden = true;
          }
        } finally {
          installButton.disabled = false;
        }
      });
      closeInstallHelp.addEventListener("click", () => {
        installModal.hidden = true;
        installButton.focus();
      });
      installModal.addEventListener("click", (event) => {
        if (event.target === installModal) installModal.hidden = true;
      });
      forceRefreshButton.addEventListener("click", async () => {
        forceRefreshButton.disabled = true;
        forceRefreshButton.textContent = "刷新中…";
        try {
          await updateApplicationShell();
          const online = await checkServerStatus();
          const loaded = await loadEntries({ force: true });
          if (online && loaded) {
            showToast("已强制刷新为服务器最新内容");
          }
        } finally {
          forceRefreshButton.disabled = false;
          forceRefreshButton.textContent = "强制刷新";
        }
      });
      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        installButton.hidden = true;
        document.documentElement.dataset.standalone = "true";
      });
      window.addEventListener("online", () => {
        checkServerStatus();
        loadEntries();
      });
      window.addEventListener("offline", () => setServerStatus(false));

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          window.location.reload();
        });
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js?v=16", {
              updateViaCache: "none",
            })
            .then(async (registration) => {
              if (registration.waiting) {
                registration.waiting.postMessage({
                  type: "ACTIVATE_UPDATE",
                });
              }
              await registration.update();
            })
            .catch(() => {});
        });
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            updateApplicationShell();
          }
        });
      }

      updateInstallButton();
      setServerStatus(navigator.onLine);
      updateCounter();
      loadEntries();
      setInterval(() => loadEntries({ silent: true }), 30000);
    </script>
  </body>
</html>
