<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="Memory" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=14" />
    <title>Memory — 记录每一个此刻</title>
    <style>
      :root {
        --ink: #1e1e1e;
        --muted: #5b5b5b;
        --paper: #f5f5f5;
        --card: #ffffff;
        --line: #1e1e1e;
        --green: #0d99ff;
        --green-dark: #0877c9;
        --accent-pink: #ff6b8a;
        --accent-yellow: #ffc700;
        --accent-green: #14ae5c;
        --danger: #d92d20;
        --shadow: 6px 6px 0 #1e1e1e;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 0;
        min-height: 100%;
        overflow-x: hidden;
        background: var(--paper);
        overscroll-behavior-y: contain;
      }

      body {
        margin: 0;
        min-width: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        color: var(--ink);
        background: var(--paper);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei",
          sans-serif;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        appearance: none;
        -webkit-appearance: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .shell {
        width: min(1040px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 80px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 720px;
        font-size: clamp(48px, 8vw, 88px);
        font-weight: 800;
        letter-spacing: -0.065em;
        line-height: 0.92;
      }

      .subtitle {
        max-width: 620px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.65;
      }

      .status-pill {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 13px;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 13px;
      }

      .header-actions {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
        flex-wrap: wrap;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-green);
        box-shadow: none;
      }

      .status-pill.offline {
        border-color: var(--line);
        background: #fff0f0;
        color: var(--danger);
      }

      .status-pill.offline .status-dot {
        background: #b7792f;
        box-shadow: 0 0 0 4px rgba(183, 121, 47, 0.14);
      }

      .install-button {
        min-height: 38px;
        padding: 8px 13px;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        background: var(--accent-yellow);
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 760;
      }

      .install-button[hidden] {
        display: none;
      }

      .install-button:hover {
        background: #ffd94a;
      }

      .refresh-button {
        min-height: 38px;
        padding: 8px 13px;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 760;
      }

      .refresh-button:hover:not(:disabled) {
        background: #ededed;
      }

      .composer {
        padding: 22px;
        border: 1.5px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: 750;
      }

      .rich-editor {
        overflow: auto;
        width: 100%;
        min-height: 250px;
        max-height: 620px;
        padding: 16px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font-family: inherit;
        font-size: 16px;
        line-height: 1.65;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        tab-size: 4;
        scroll-margin-block: 16px;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      .rich-editor:focus,
      .rich-editor.dragging {
        border-color: var(--green);
        box-shadow: 0 0 0 4px rgba(13, 153, 255, 0.18);
      }

      .rich-editor:empty::before {
        color: #7a7a7a;
        content: attr(data-placeholder);
        pointer-events: none;
      }

      .inline-draft-image {
        position: relative;
        display: grid;
        width: fit-content;
        max-width: 100%;
        margin: 10px 0;
        place-items: center;
        border-radius: 12px;
        background: #f1f4f1;
      }

      .inline-draft-image img {
        display: block;
        max-width: 100%;
        max-height: 360px;
        border-radius: 12px;
        object-fit: contain;
      }

      .inline-draft-remove {
        position: absolute;
        top: 8px;
        right: 8px;
        display: grid;
        width: 30px;
        height: 30px;
        padding: 0;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        background: rgba(31, 43, 39, 0.78);
        color: #fff;
        cursor: pointer;
        font-size: 19px;
        font-weight: 400;
        line-height: 1;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      }

      .inline-draft-remove:hover {
        background: rgba(134, 48, 41, 0.92);
      }

      .composer-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 14px;
      }

      .composer-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 5px;
      }

      .choose-image {
        min-height: 42px;
        padding: 9px 13px;
        border: 1.5px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
      }

      .choose-image:hover {
        background: #ededed;
      }

      #image-input {
        display: none;
      }

      .pending-attachment {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 12px;
        padding: 12px 14px;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        background: #fff7d6;
      }

      .pending-attachment[hidden] {
        display: none;
      }

      .pending-attachment-info {
        min-width: 0;
      }

      .pending-attachment-name {
        overflow: hidden;
        margin: 0 0 3px;
        font-size: 13px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pending-attachment-size {
        color: var(--muted);
        font-size: 12px;
      }

      .camera-modal {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        padding: 18px;
        place-items: center;
        background: rgba(9, 20, 17, 0.9);
      }

      .camera-modal[hidden] {
        display: none;
      }

      .install-modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        padding: 18px;
        place-items: center;
        background: rgba(0, 0, 0, 0.62);
      }

      .install-modal[hidden] {
        display: none;
      }

      .install-panel {
        width: min(100%, 440px);
        padding: 24px;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        background: #fff;
        box-shadow: 8px 8px 0 var(--ink);
      }

      .install-panel h2 {
        margin-bottom: 12px;
      }

      .install-help {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.75;
        white-space: pre-line;
      }

      .install-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
      }

      .camera-panel {
        width: min(100%, 520px);
        overflow: hidden;
        border-radius: 18px;
        background: #1e1e1e;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .camera-preview {
        display: block;
        width: 100%;
        max-height: 70vh;
        background: #000;
        object-fit: contain;
      }

      .camera-status {
        margin: 0;
        padding: 12px 16px 0;
        color: #fff;
        font-size: 13px;
        text-align: center;
      }

      .camera-actions {
        display: flex;
        gap: 10px;
        padding: 14px 16px 16px;
      }

      .camera-actions button {
        flex: 1;
        min-height: 46px;
      }

      .hint,
      .counter {
        color: var(--muted);
        font-size: 12px;
      }

      .counter.over {
        color: var(--danger);
        font-weight: 700;
      }

      .primary,
      .secondary,
      .danger,
      .icon-button {
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        font-weight: 720;
        transition:
          background-color 150ms ease,
          transform 100ms ease,
          opacity 150ms ease;
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid rgba(13, 153, 255, 0.35);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .primary {
        min-width: 128px;
        padding: 12px 18px;
        border: 1.5px solid var(--line);
        background: var(--green);
        color: #fff;
        box-shadow: 3px 3px 0 var(--ink);
      }

      .primary:hover:not(:disabled) {
        background: var(--green-dark);
      }

      .history-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: 40px 0 15px;
      }

      .history-title {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      h2 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .count {
        color: var(--muted);
        font-size: 13px;
      }

      .danger {
        padding: 8px 11px;
        background: transparent;
        color: var(--danger);
        font-size: 13px;
      }

      .danger:hover:not(:disabled) {
        background: rgba(164, 62, 53, 0.08);
      }

      .history {
        display: grid;
        gap: 14px;
      }

      .entry {
        overflow: hidden;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        background: #fff;
        box-shadow: 4px 4px 0 rgba(30, 30, 30, 0.14);
      }

      .entry-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 14px;
        border-bottom: 1.5px solid var(--line);
        background: #f5f5f5;
      }

      .meta-left {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .kind-badge {
        padding: 3px 7px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #d6f5e2;
        color: var(--ink);
        font-size: 11px;
        font-weight: 760;
      }

      time {
        color: var(--muted);
        font-size: 12px;
      }

      .entry-actions {
        display: flex;
        gap: 6px;
      }

      .secondary,
      .icon-button,
      .secondary-link {
        padding: 7px 10px;
        border: 0;
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        box-shadow: inset 0 0 0 1.5px var(--line);
        cursor: pointer;
        font-size: 12px;
        font-weight: 720;
        text-decoration: none;
      }

      .secondary:hover,
      .icon-button:hover,
      .secondary-link:hover {
        background: #ededed;
      }

      .entry-editor {
        padding: 16px;
      }

      .entry-editor textarea {
        display: block;
        width: 100%;
        min-height: 180px;
        max-height: 480px;
        resize: vertical;
        padding: 14px;
        border: 1px solid #b9c9c1;
        border-radius: 11px;
        outline: none;
        background: #fff;
        color: #24322f;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.65;
      }

      .entry-editor textarea:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 4px rgba(13, 153, 255, 0.18);
      }

      .entry-editor-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
      }

      .entry-editor-actions {
        display: flex;
        gap: 8px;
      }

      .entry-editor-count {
        color: var(--muted);
        font-size: 12px;
      }

      .entry-editor-count.over {
        color: var(--danger);
        font-weight: 700;
      }

      .icon-button {
        color: var(--danger);
      }

      pre {
        overflow: auto;
        max-height: 480px;
        margin: 0;
        padding: 18px;
        color: #24322f;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.65;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        tab-size: 4;
      }

      .image-content {
        padding: 14px;
      }

      .image-preview-link {
        display: grid;
        overflow: hidden;
        width: 100%;
        min-height: 180px;
        max-height: 520px;
        place-items: center;
        border-radius: 12px;
        background: #fff;
      }

      .image-preview {
        display: block;
        width: 100%;
        max-height: 520px;
        object-fit: contain;
      }

      .image-details {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 3px 1px;
      }

      .image-caption {
        max-height: 260px;
        margin: 12px 0;
        padding: 13px 14px;
        border: 1px solid #e1e7e2;
        border-radius: 10px;
        background: #f7f9f7;
      }

      .image-caption.before-image {
        margin-top: 0;
      }

      .file-name {
        overflow: hidden;
        margin: 0 0 3px;
        font-size: 13px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-size {
        color: var(--muted);
        font-size: 12px;
      }

      .attachment-content {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .attachment-card {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
        padding: 14px;
        border: 1px solid #dce4de;
        border-radius: 12px;
        background: #f6f8f6;
      }

      .attachment-icon {
        display: grid;
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 11px;
        background: #e3eee8;
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
      }

      .empty,
      .loading {
        padding: 46px 20px;
        border: 1px dashed #c7d0c9;
        border-radius: 16px;
        color: var(--muted);
        text-align: center;
      }

      .empty strong {
        display: block;
        margin-bottom: 7px;
        color: var(--ink);
        font-size: 16px;
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 10;
        max-width: min(360px, calc(100vw - 44px));
        padding: 12px 16px;
        border-radius: 11px;
        border: 1.5px solid #fff;
        background: #1e1e1e;
        color: #fff;
        box-shadow: 0 12px 30px rgba(19, 47, 41, 0.25);
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .toast.error {
        background: #84352e;
      }

      @media (max-width: 640px) {
        body {
          width: 100%;
          overscroll-behavior-x: none;
        }

        .shell {
          width: 100%;
          max-width: 480px;
          padding:
            max(20px, env(safe-area-inset-top))
            max(16px, env(safe-area-inset-right))
            calc(88px + env(safe-area-inset-bottom))
            max(16px, env(safe-area-inset-left));
        }

        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 16px;
        }

        .eyebrow {
          margin-bottom: 4px;
          font-size: 10px;
        }

        h1 {
          font-size: clamp(46px, 14vw, 64px);
          line-height: 0.92;
        }

        .subtitle {
          max-width: none;
          margin-top: 7px;
          font-size: 15px;
          line-height: 1.6;
        }

        .header-actions {
          width: 100%;
          justify-content: flex-start;
        }

        .status-pill,
        .install-button,
        .refresh-button {
          min-height: 44px;
        }

        .composer {
          padding: 15px;
          border-radius: 14px;
          box-shadow: 4px 4px 0 var(--ink);
        }

        label {
          margin-bottom: 8px;
        }

        .rich-editor {
          min-height: clamp(148px, 22dvh, 184px);
          max-height: 44dvh;
          padding: 12px;
          font-size: 16px;
        }

        .composer-footer {
          align-items: stretch;
          flex-direction: column;
          gap: 8px;
          margin-top: 10px;
        }

        .composer-footer > div {
          width: 100%;
        }

        .composer-tools {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        .choose-image {
          width: 100%;
          min-height: 44px;
          padding: 10px 9px;
          font-size: 13px;
        }

        .hint {
          grid-column: 1 / -1;
          line-height: 1.5;
        }

        .primary {
          width: 100%;
          min-height: 50px;
          font-size: 15px;
        }

        .pending-attachment .icon-button,
        .danger,
        .secondary,
        .icon-button,
        .secondary-link {
          min-height: 44px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        .history-heading {
          margin-top: 26px;
        }

        .entry-meta {
          align-items: flex-start;
          flex-direction: column;
        }

        .entry-actions {
          width: 100%;
          flex-wrap: wrap;
        }

        .entry-editor {
          padding: 12px;
        }

        .entry-editor textarea {
          min-height: 160px;
          padding: 12px;
          font-size: 16px;
        }

        .entry-editor-footer {
          align-items: stretch;
          flex-direction: column;
        }

        .entry-editor-actions button {
          flex: 1;
          min-height: 44px;
        }

        .image-details {
          align-items: flex-start;
          flex-direction: column;
        }

        .camera-actions .secondary,
        .camera-actions .primary {
          min-height: 48px;
        }

        .toast {
          right: 12px;
          bottom: calc(82px + env(safe-area-inset-bottom));
          max-width: calc(100vw - 24px);
        }
      }

      @media (max-width: 360px) {
        .composer-tools {
          grid-template-columns: 1fr;
        }

        #quick-camera,
        .hint {
          grid-column: 1;
        }

        .header-actions {
          gap: 7px;
        }
      }

      @media (display-mode: standalone) {
        body {
          min-height: 100dvh;
        }

        .install-button {
          display: none;
        }

        .shell {
          padding-bottom: calc(32px + env(safe-area-inset-bottom));
        }

        .toast {
          bottom: calc(18px + env(safe-area-inset-bottom));
        }
      }

      @supports (-webkit-touch-callout: none) {
        html,
        body {
          min-height: -webkit-fill-available;
        }

        .rich-editor,
        .entry-editor textarea {
          font-size: 16px;
        }

        .install-modal,
        .camera-modal {
          height: 100dvh;
          -webkit-overflow-scrolling: touch;
        }
      }

      @media (max-width: 640px) and (display-mode: standalone) {
        html,
        body {
          width: 100%;
          max-width: 100%;
          min-height: 100%;
        }

        .shell {
          width: 100%;
          max-width: none;
          min-height: 100vh;
          min-height: 100dvh;
          padding-top: max(20px, env(safe-area-inset-top));
          padding-right: max(12px, env(safe-area-inset-right));
          padding-bottom: max(
            32px,
            calc(18px + env(safe-area-inset-bottom))
          );
          padding-left: max(12px, env(safe-area-inset-left));
        }

        .header-actions {
          display: grid;

  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Capture what matters</p>
          <h1>Memory</h1>
          <p class="subtitle">
